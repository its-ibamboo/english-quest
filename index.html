<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>英文任務系統</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #F7F5F0;
    color: #2A2A33;
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height: 100%;
  }
  #root {
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hud {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .hud-bar {
    flex: 1;
    margin: 0 12px;
    height: 8px;
    border-radius: 999px;
    background: #E7E5DE;
    overflow: hidden;
  }
  .hud-bar-fill {
    height: 100%;
    background: #C97F00;
    transition: width 0.3s;
  }
  .hud-trophy { color: #0E8F82; display:flex; align-items:center; gap:4px; }
  .best-row {
    width: 100%;
    max-width: 440px;
    text-align: center;
    font-size: 12px;
    font-family: monospace;
    color: #82869C;
    margin-bottom: 12px;
  }
  h1.title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 2px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    color: #6B7086;
    font-size: 14px;
    margin: 0 0 16px;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-family: monospace;
    border: 1px solid rgba(14,143,130,0.35);
    background: transparent;
    color: #6B7086;
    cursor: pointer;
  }
  .chip.active {
    background: #0E8F82;
    border-color: #0E8F82;
    color: #F7F5F0;
    font-weight: 600;
  }
  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    background: #FFFFFF;
    padding: 4px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  .mode-tab {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: #6B7086;
    cursor: pointer;
  }
  .mode-tab.active {
    background: #C97F00;
    color: #F7F5F0;
  }
  .panel {
    width: 100%;
    max-width: 380px;
  }
  .card-outer {
    width: 100%;
    height: 220px;
    perspective: 1000px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .card-front {
    background: #FFFFFF;
    border: 1px solid rgba(14,143,130,0.35);
  }
  .card-back {
    background: #C97F00;
    color: #F7F5F0;
    transform: rotateY(180deg);
  }
  .word-en { font-size: 28px; font-weight: 700; }
  .word-meta { color: #82869C; font-size: 12px; margin-top: 4px; }
  .card-back .word-meta { color: rgba(247,245,240,0.75); }
  .speak-btn {
    margin-top: 14px;
    background: none;
    border: none;
    color: #0E8F82;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hint { margin-top: 20px; color: #82869C; font-size: 12px; }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .nav-btn {
    padding: 8px 16px;
    border-radius: 8px;
    background: #FFFFFF;
    color: #2A2A33;
    border: none;
    font-size: 14px;
    cursor: pointer;
  }
  .nav-count { color: #82869C; font-size: 12px; font-family: monospace; }
  .quiz-box, .grammar-box, .scramble-box {
    width: 100%;
    border-radius: 16px;
    background: #FFFFFF;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
    text-align: center;
  }
  .option-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
  }
  .option-btn {
    padding: 12px 16px;
    border-radius: 12px;
    background: #FFFFFF;
    color: #2A2A33;
    border: none;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .option-btn.correct { background: #0C9A6E; color: #F7F5F0; }
  .option-btn.wrong { background: #D63A5C; color: #fff; }
  .option-btn.dim { opacity: 0.5; }
  .option-btn.mono { font-family: monospace; justify-content: center; }
  .next-btn {
    margin-top: 16px;
    padding: 8px 20px;
    border-radius: 999px;
    background: #C97F00;
    color: #F7F5F0;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tip-box {
    width: 100%;
    margin-top: 14px;
    border-radius: 12px;
    background: #FFFFFF;
    padding: 14px;
    font-size: 14px;
    color: #6B7086;
    text-align: left;
  }
  .scramble-zh { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .token-area {
    width: 100%;
    min-height: 56px;
    border: 2px dashed rgba(14,143,130,0.35);
    border-radius: 12px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .token-placeholder { color: #82869C; font-size: 12px; align-self: center; padding: 0 8px; }
  .token-chip {
    padding: 6px 12px;
    border-radius: 8px;
    background: #C97F00;
    color: #F7F5F0;
    font-family: monospace;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }
  .token-chip.pool {
    background: #E7E5DE;
    color: #2A2A33;
  }
  .token-pool {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .check-btn {
    padding: 8px 20px;
    border-radius: 999px;
    background: #C97F00;
    color: #F7F5F0;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .check-btn:disabled { opacity: 0.3; cursor: default; }
  .result-correct { margin-top: 12px; color: #0C9A6E; font-weight: 600; }
  .result-wrong { margin-top: 12px; text-align: center; }
  .result-wrong .label { color: #D63A5C; font-weight: 600; margin-bottom: 4px; }
  .result-wrong .answer { color: #6B7086; font-size: 14px; }
  .footer-stats {
    display: flex;
    gap: 16px;
    margin-top: 24px;
    font-size: 12px;
    font-family: monospace;
    color: #6B7086;
  }
  .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(14,143,130,0.12);
    color: #0E8F82;
    font-size: 12px;
  }
  .hearts-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 20px;
    width: 100%;
    margin-bottom: 10px;
  }
  .timer-bar-outer {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: #E7E5DE;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .timer-bar-fill {
    height: 100%;
    background: #0E8F82;
    transition: width 1s linear;
  }
  .stage-map {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .stage-section-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .stage-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .stage-node {
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    background: #FFFFFF;
    color: #2A2A33;
    box-shadow: 0 0 0 2px rgba(14,143,130,0.35);
  }
  .stage-node.locked {
    background: #E7E5DE;
    color: #82869C;
    box-shadow: none;
    cursor: default;
  }
  .stage-node.current {
    background: #C97F00;
    color: #F7F5F0;
    box-shadow: 0 0 0 4px rgba(201,127,0,0.25);
  }
  .stage-node.cleared {
    background: #0C9A6E;
    color: #F7F5F0;
    box-shadow: none;
  }
  .stage-stars {
    font-size: 8px;
    margin-top: 2px;
    letter-spacing: -1px;
  }
  .stage-result-overlay {
    width: 100%;
    text-align: center;
    padding: 24px 16px;
    background: #FFFFFF;
    border-radius: 16px;
  }
</style>
</head>

  { sentence: "We ___ watching TV when the power went out.", options: ["was", "were", "is", "are"], correct: "were", tip: "複數主詞的過去進行式用 were", level: "basic", zh: "停電時我們正在看電視。" },
  { sentence: "Look! The baby ___ laughing.", options: ["is", "was", "am", "are"], correct: "is", tip: "Look! 提示現在正在發生的動作，用現在進行式", level: "basic", zh: "看！那個嬰兒正在笑。" },
  { sentence: "While I ___ doing my homework, my brother was playing games.", options: ["was", "were", "is", "am"], correct: "was", tip: "while 表示同時進行的兩個過去動作，都用過去進行式", level: "basic", zh: "我在做功課的時候，我弟弟正在玩遊戲。" },
  { sentence: "She isn't ___ right now; she's reading.", options: ["sleep", "sleeps", "sleeping", "slept"], correct: "sleeping", tip: "be動詞 + Ving，構成現在進行式", level: "basic", zh: "她現在沒有在睡覺，她正在看書。" },
  { sentence: "This book is very ___.", options: ["interesting", "interested", "interest", "interests"], correct: "interesting", tip: "事物本身「令人感興趣」用 interesting", level: "advanced", zh: "這本書非常有趣。" },
  { sentence: "I am ___ in this book.", options: ["interesting", "interested", "interest", "interests"], correct: "interested", tip: "人「感到興趣」用 interested", level: "advanced", zh: "我對這本書很感興趣。" },
  { sentence: "The movie was so ___ that I fell asleep.", options: ["boring", "bored", "bore", "bores"], correct: "boring", tip: "事物「令人感到無聊」用 boring", level: "advanced", zh: "這部電影太無聊了，我睡著了。" },
  { sentence: "I feel ___ after the long lecture.", options: ["boring", "bored", "bore", "bores"], correct: "bored", tip: "人「感到無聊」用 bored", level: "advanced", zh: "聽完這場冗長的演講後我覺得很無聊。" },
  { sentence: "The news was really ___.", options: ["surprising", "surprised", "surprise", "surprises"], correct: "surprising", tip: "事物「令人驚訝」用 surprising", level: "advanced", zh: "這個消息真的很令人驚訝。" },
  { sentence: "I was ___ to hear the news.", options: ["surprising", "surprised", "surprise", "surprises"], correct: "surprised", tip: "人「感到驚訝」用 surprised", level: "advanced", zh: "聽到這個消息我感到很驚訝。" },
  { sentence: "This roller coaster is ___!", options: ["exciting", "excited", "excite", "excites"], correct: "exciting", tip: "事物「令人興奮」用 exciting", level: "advanced", zh: "這雲霄飛車真刺激！" },
  { sentence: "The kids were ___ about the trip.", options: ["exciting", "excited", "excite", "excites"], correct: "excited", tip: "人「感到興奮」用 excited", level: "advanced", zh: "孩子們對這趟旅行感到很興奮。" },
  { sentence: "The test results were ___.", options: ["satisfying", "satisfied", "satisfy", "satisfies"], correct: "satisfying", tip: "事物「令人滿意」用 satisfying", level: "advanced", zh: "考試結果令人滿意。" },
  { sentence: "I looked at ___ in the mirror.", options: ["me", "myself", "mine", "my"], correct: "myself", tip: "反身代名詞：主詞和受詞是同一人時使用", level: "basic", zh: "我在鏡子裡看著自己。" },
  { sentence: "She hurt ___ while cooking.", options: ["her", "herself", "hers", "she"], correct: "herself", tip: "反身代名詞 herself", level: "basic", zh: "她煮飯時弄傷了自己。" },
  { sentence: "They enjoyed ___ at the party.", options: ["them", "themselves", "their", "theirs"], correct: "themselves", tip: "enjoy oneself：玩得開心（固定用法）", level: "basic", zh: "他們在派對上玩得很開心。" },
  { sentence: "He taught ___ how to play guitar.", options: ["him", "himself", "his", "he"], correct: "himself", tip: "反身代名詞 himself，表示「自學」", level: "basic", zh: "他自學彈吉他。" },
  { sentence: "We made the cake ___.", options: ["us", "ourselves", "our", "ours"], correct: "ourselves", tip: "反身代名詞也可表示「親自」做某事", level: "basic", zh: "我們自己做了這個蛋糕。" },
  { sentence: "Did you do this ___?", options: ["you", "yourself", "your", "yours"], correct: "yourself", tip: "反身代名詞 yourself，強調「你自己」", level: "basic", zh: "這是你自己做的嗎？" },
  { sentence: "The cat cleaned ___.", options: ["it", "itself", "its", "it's"], correct: "itself", tip: "反身代名詞 itself，指動物或事物本身", level: "basic", zh: "這隻貓自己清潔。" },
  { sentence: "Please help ___ to some cookies.", options: ["you", "yourself", "your", "yours"], correct: "yourself", tip: "help yourself to sth：請自行取用（固定用語）", level: "basic", zh: "請自行取用一些餅乾。" },
  { sentence: "The children can dress ___ now.", options: ["them", "themselves", "their", "theirs"], correct: "themselves", tip: "反身代名詞 themselves", level: "basic", zh: "孩子們現在可以自己穿衣服了。" },
  { sentence: "I have ___ to tell you.", options: ["something", "anything", "nothing", "someone"], correct: "something", tip: "肯定句用 something", level: "basic", zh: "我有事要告訴你。" },
  { sentence: "I don't have ___ to say.", options: ["something", "anything", "nothing", "someone"], correct: "anything", tip: "否定句用 anything，不用 something", level: "basic", zh: "我沒有什麼話要說。" },
  { sentence: "___ knocked on the door.", options: ["Something", "Someone", "Anything", "Nothing"], correct: "Someone", tip: "指「有人」用 someone/somebody", level: "basic", zh: "有人敲了門。" },
  { sentence: "Is there ___ in the fridge?", options: ["something", "anything", "nothing", "someone"], correct: "anything", tip: "疑問句用 anything", level: "basic", zh: "冰箱裡有東西嗎？" },
  { sentence: "___ is perfect; we all make mistakes.", options: ["Nobody", "Everybody", "Somebody", "Anybody"], correct: "Nobody", tip: "nobody 表示「沒有人」，本身已是否定意思", level: "basic", zh: "沒有人是完美的，我們都會犯錯。" },
  { sentence: "I looked everywhere, but I found ___.", options: ["something", "anything", "nothing", "someone"], correct: "nothing", tip: "nothing 表示「什麼都沒有」，肯定句形式但意思是否定的", level: "basic", zh: "我到處找，但什麼都沒找到。" },
  { sentence: "Does ___ want to come with us?", options: ["anybody", "somebody", "nobody", "everybody"], correct: "anybody", tip: "疑問句中常用 anybody", level: "basic", zh: "有人想跟我們一起去嗎？" },
  { sentence: "___ in this class is very friendly.", options: ["Everyone", "Someone", "Anyone", "No one"], correct: "Everyone", tip: "everyone 表示「每個人」，接單數動詞", level: "basic", zh: "這班上的每個人都很友善。" },
  { sentence: "I saw ___ interesting today.", options: ["something", "anything", "nothing", "someone"], correct: "something", tip: "something + 形容詞，用於肯定句", level: "basic", zh: "我今天看到一件有趣的事。" },
  { sentence: "I wish it ___ stop raining.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would，表示希望某事改變（帶有抱怨語氣）", level: "hell", zh: "我希望雨會停。" },
  { sentence: "I wish you ___ stop making noise.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would，希望對方改變行為", level: "hell", zh: "我希望你不要再製造噪音了。" },
  { sentence: "She wishes he ___ call her more often.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would，第三人稱主詞也適用", level: "hell", zh: "她希望他能更常打電話給她。" },
  { sentence: "I wish they ___ turn down the music.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would 表示希望對方改變", level: "hell", zh: "我希望他們把音樂關小聲一點。" },
  { sentence: "He wishes it ___ snow this winter.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would，希望某件事發生", level: "hell", zh: "他希望今年冬天會下雪。" },
  { sentence: "We wish the bus ___ come faster.", options: ["will", "would", "can", "could"], correct: "would", tip: "wish + would 表示帶著不耐煩的期望", level: "hell", zh: "我們希望公車快點來。" },
  { sentence: "Do you like pizza? Yes, I ___.", options: ["do", "does", "am", "is"], correct: "do", tip: "簡答句：一般動詞疑問句用 do/does 回答", level: "basic", zh: "你喜歡披薩嗎？是的，我喜歡。" },
  { sentence: "Does she play tennis? No, she ___.", options: ["do", "does", "doesn't", "don't"], correct: "doesn't", tip: "第三人稱單數的簡答用 doesn't", level: "basic", zh: "她會打網球嗎？不，她不會。" },
  { sentence: "Is he a teacher? Yes, he ___.", options: ["is", "am", "are", "does"], correct: "is", tip: "be動詞疑問句用 be動詞回答", level: "basic", zh: "他是老師嗎？是的，他是。" },
  { sentence: "Are they students? No, they ___.", options: ["isn't", "aren't", "don't", "doesn't"], correct: "aren't", tip: "複數主詞用 aren't 回答", level: "basic", zh: "他們是學生嗎？不，他們不是。" },
  { sentence: "Can you swim? Yes, I ___.", options: ["can", "do", "am", "could"], correct: "can", tip: "助動詞疑問句用同一個助動詞回答", level: "basic", zh: "你會游泳嗎？是的，我會。" },
  { sentence: "Did you finish your homework? No, I ___.", options: ["don't", "didn't", "doesn't", "wasn't"], correct: "didn't", tip: "過去式疑問句用 didn't 回答", level: "basic", zh: "你做完功課了嗎？不，我沒有。" },
  { sentence: "Have you eaten lunch? Yes, I ___.", options: ["have", "has", "do", "am"], correct: "have", tip: "現在完成式疑問句用 have/has 回答", level: "advanced", zh: "你吃過午餐了嗎？是的，我吃過了。" },
  { sentence: "Will she come tomorrow? No, she ___.", options: ["won't", "doesn't", "isn't", "didn't"], correct: "won't", tip: "未來式疑問句用 won't 回答", level: "basic", zh: "她明天會來嗎？不，她不會。" },
  { sentence: "I get up ___ 7 a.m.", options: ["in", "on", "at", "by"], correct: "at", tip: "at + 確切時刻", level: "basic", zh: "我早上七點起床。" },
  { sentence: "We have a test ___ Monday.", options: ["in", "on", "at", "by"], correct: "on", tip: "on + 星期幾/日期", level: "basic", zh: "我們星期一有考試。" },
  { sentence: "She was born ___ 2010.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 年/月/季節", level: "basic", zh: "她在2010年出生。" },
  { sentence: "I usually study ___ the morning.", options: ["in", "on", "at", "by"], correct: "in", tip: "in the morning/afternoon/evening", level: "basic", zh: "我通常早上唸書。" },
  { sentence: "The shop opens ___ 9 o'clock.", options: ["in", "on", "at", "by"], correct: "at", tip: "at + 時刻", level: "basic", zh: "商店九點開門。" },
  { sentence: "My birthday is ___ July.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 月份", level: "basic", zh: "我的生日在七月。" },
  { sentence: "They usually go hiking ___ the weekend.", options: ["in", "on", "at", "by"], correct: "on", tip: "on the weekend", level: "basic", zh: "他們通常在週末去健行。" },
  { sentence: "We often go to the beach ___ summer.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 季節", level: "basic", zh: "我們常常在夏天去海邊。" },
  { sentence: "I go to bed ___ night.", options: ["in", "on", "at", "by"], correct: "at", tip: "at night 固定用法", level: "basic", zh: "我晚上睡覺。" },
  { sentence: "The cat is ___ the box.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 較大或封閉空間的裡面", level: "basic", zh: "貓在箱子裡。" },
  { sentence: "The book is ___ the table.", options: ["in", "on", "at", "by"], correct: "on", tip: "on + 表面上", level: "basic", zh: "書在桌子上。" },
  { sentence: "She is waiting ___ the bus stop.", options: ["in", "on", "at", "by"], correct: "at", tip: "at + 較小或特定的地點", level: "basic", zh: "她在公車站等。" },
  { sentence: "There is a poster ___ the wall.", options: ["in", "on", "at", "by"], correct: "on", tip: "on + 牆面（表面）", level: "basic", zh: "牆上有一張海報。" },
  { sentence: "He lives ___ Taipei.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 城市/國家", level: "basic", zh: "他住在台北。" },
  { sentence: "I'll meet you ___ the corner.", options: ["in", "on", "at", "by"], correct: "at", tip: "at + 特定的一個點", level: "basic", zh: "我會在轉角跟你碰面。" },
  { sentence: "The keys are ___ my pocket.", options: ["in", "on", "at", "by"], correct: "in", tip: "in + 口袋內部", level: "basic", zh: "鑰匙在我的口袋裡。" },
  { sentence: "The dog is sleeping ___ the sofa.", options: ["in", "on", "at", "by"], correct: "on", tip: "on + 沙發表面", level: "basic", zh: "那隻狗正在沙發上睡覺。" },
  { sentence: "There are many stars ___ the sky.", options: ["in", "on", "at", "by"], correct: "in", tip: "in the sky 是固定用法", level: "basic", zh: "天空中有很多星星。" },
  { sentence: "She's not answering her phone. She ___ be asleep.", options: ["must", "mustn't", "can't", "should"], correct: "must", tip: "must 表示「很有把握」的推測：一定是", level: "advanced", zh: "她沒有接電話，她一定睡著了。" },
  { sentence: "It ___ rain later; the sky is cloudy.", options: ["must", "may", "mustn't", "can't"], correct: "may", tip: "may 表示「可能」，語氣不如 must 肯定", level: "advanced", zh: "待會可能會下雨，天空多雲。" },
  { sentence: "He ___ be at home now; I just saw him at school.", options: ["must", "may", "can't", "should"], correct: "can't", tip: "can't 表示根據線索判斷「不可能」", level: "advanced", zh: "他現在不可能在家，我剛剛才在學校看到他。" },
  { sentence: "She might ___ the answer.", options: ["know", "knows", "knowing", "known"], correct: "know", tip: "情態助動詞後面要接原形動詞", level: "advanced", zh: "她可能知道答案。" },
  { sentence: "They ___ be tired after the long trip.", options: ["must", "mustn't", "don't", "won't"], correct: "must", tip: "must 表示肯定的推測", level: "advanced", zh: "經過長途旅行，他們一定很累。" },
  { sentence: "This ___ be his house; the address matches.", options: ["must", "may", "can't", "should"], correct: "must", tip: "must 表示「一定是」的推測", level: "advanced", zh: "這一定是他的家，地址對得上。" },
  { sentence: "He's wearing a coat. It ___ be cold outside.", options: ["must", "mustn't", "won't", "don't"], correct: "must", tip: "根據線索合理推測，用 must", level: "advanced", zh: "他穿著外套，外面一定很冷。" },
  { sentence: "She ___ be joking; that's impossible!", options: ["must", "may", "can't", "should"], correct: "can't", tip: "can't 表示「不可能」的推測", level: "advanced", zh: "她不可能在開玩笑，那不可能！" },
  { sentence: "There's no answer. They ___ be out.", options: ["must", "mustn't", "should", "would"], correct: "must", tip: "must 表示合理的推測", level: "advanced", zh: "沒有人接電話，他們一定外出了。" },
  { sentence: "___ I got home, it started to rain.", options: ["When", "While", "Before", "Unless"], correct: "When", tip: "when 表示「當...的時候」", level: "basic", zh: "我一到家就開始下雨了。" },
  { sentence: "___ she was cooking, the phone rang.", options: ["When", "While", "Before", "After"], correct: "While", tip: "while 表示「當...同時」，常搭配進行式", level: "basic", zh: "電話響的時候她正在煮飯。" },
  { sentence: "Please wash your hands ___ you eat.", options: ["when", "while", "before", "after"], correct: "before", tip: "before 表示「在...之前」", level: "basic", zh: "吃飯前請洗手。" },
  { sentence: "___ finishing his homework, he watched TV.", options: ["When", "While", "Before", "After"], correct: "After", tip: "after 表示「在...之後」", level: "basic", zh: "做完功課後他看了電視。" },
  { sentence: "I'll call you ___ I arrive.", options: ["when", "while", "before", "as soon as"], correct: "as soon as", tip: "as soon as 表示「一...就...」", level: "basic", zh: "我一到就會打給你。" },
  { sentence: "___ you leave, please turn off the lights.", options: ["When", "While", "Before", "After"], correct: "Before", tip: "before 表示「在...之前」", level: "basic", zh: "離開前請關燈。" },
  { sentence: "She was reading a book ___ I was watching TV.", options: ["when", "while", "before", "after"], correct: "while", tip: "while 連接兩個同時進行的動作", level: "basic", zh: "她在看書的時候我正在看電視。" },
  { sentence: "___ the movie ended, everyone left.", options: ["When", "While", "Before", "After"], correct: "When", tip: "when 表示「當...時」", level: "basic", zh: "電影結束時，大家都離開了。" },
  { sentence: "Call me ___ you get there.", options: ["when", "while", "before", "as soon as"], correct: "as soon as", tip: "as soon as 表示「一...就馬上...」", level: "basic", zh: "你一到那裡就打給我。" },
  { sentence: "It was ___ cold that we stayed inside.", options: ["so", "such", "so a", "such a"], correct: "so", tip: "so + 形容詞 + that 子句", level: "advanced", zh: "天氣太冷了，我們待在裡面。" },
  { sentence: "It was ___ a cold day that we stayed inside.", options: ["so", "such", "so a", "such a"], correct: "such", tip: "such + a + 形容詞 + 名詞 + that 子句", level: "advanced", zh: "那是如此寒冷的一天，我們待在裡面。" },
  { sentence: "She is ___ kind that everyone likes her.", options: ["so", "such", "so a", "such a"], correct: "so", tip: "so + 形容詞 + that", level: "advanced", zh: "她很親切，大家都喜歡她。" },
  { sentence: "She is ___ a kind person that everyone likes her.", options: ["so", "such", "so a", "such a"], correct: "such", tip: "such + a + 形容詞 + 名詞 + that", level: "advanced", zh: "她是如此親切的人，大家都喜歡她。" },
  { sentence: "The movie was ___ boring that I fell asleep.", options: ["so", "such", "so a", "such a"], correct: "so", tip: "so + 形容詞 + that", level: "advanced", zh: "這部電影太無聊了，我睡著了。" },
  { sentence: "It was ___ a boring movie that I fell asleep.", options: ["so", "such", "so a", "such a"], correct: "such", tip: "such + a + 形容詞 + 名詞 + that", level: "advanced", zh: "那是一部如此無聊的電影，我睡著了。" },
  { sentence: "He ran ___ fast that no one could catch him.", options: ["so", "such", "so a", "such a"], correct: "so", tip: "so + 副詞 + that", level: "advanced", zh: "他跑得很快，沒有人追得上他。" },
  { sentence: "They are ___ nice people that everyone loves them.", options: ["so", "such", "so a", "such a"], correct: "such", tip: "such + 形容詞 + 複數名詞 + that（不加 a）", level: "advanced", zh: "他們人這麼好，大家都很愛他們。" },
  { sentence: "The soup was ___ hot that I couldn't eat it.", options: ["so", "such", "so a", "such a"], correct: "so", tip: "so + 形容詞 + that", level: "advanced", zh: "這湯太燙了，我沒辦法吃。" },
  { sentence: "You will be late ___ you hurry.", options: ["if", "unless", "when", "because"], correct: "unless", tip: "unless = if...not，表示「除非」", level: "advanced", zh: "你不趕快就會遲到。" },
  { sentence: "___ it rains, we will go to the park.", options: ["If", "Unless", "When", "Because"], correct: "Unless", tip: "unless 表示「除非...（否則）」", level: "advanced", zh: "除非下雨，我們就會去公園。" },
  { sentence: "I won't go ___ you come with me.", options: ["if", "unless", "when", "because"], correct: "unless", tip: "unless 表示條件性的否定", level: "advanced", zh: "除非你跟我一起去，不然我不會去。" },
  { sentence: "___ you study hard, you won't pass the exam.", options: ["If", "Unless", "When", "Because"], correct: "Unless", tip: "unless = if...not", level: "advanced", zh: "除非你用功唸書，否則你不會通過考試。" },
  { sentence: "She can't join us ___ she finishes her work.", options: ["if", "unless", "when", "because"], correct: "unless", tip: "unless 表示除非達成某條件", level: "advanced", zh: "除非她完成工作，否則不能跟我們一起去。" },

var LEVEL_SIZE = 5;
var DIFFICULTIES = [
  { key: "basic", label: "基礎" },
  { key: "advanced", label: "進階" },
  { key: "hell", label: "地獄" },
  { key: "all", label: "全部" }
];
var MODES = [
  { key: "flash", label: "閃卡" },
  { key: "quiz", label: "單字測驗" },
  { key: "grammar", label: "文法" },
  { key: "scramble", label: "重組句子" },
  { key: "adventure", label: "\uD83D\uDDFA\uFE0F 闖關地圖" }
];

var STAGE_SIZE = 20;
var HEARTS_START = 3;
var TIME_PER_Q = 12;

// 固定種子的洗牌，讓每個難度的單字順序打散、不再照字母排列，
// 但同一份清單每次重新整理頁面時排列結果都一樣（關卡內容穩定不會變動）
function seededRandom(seed) {
  return function () {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  };
}
function seededShuffle(arr, seed) {
  var rand = seededRandom(seed);
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function buildStages() {
  var stages = [];
  ["basic", "advanced", "hell"].forEach(function (lvl, lvlIdx) {
    var words = WORD_BANK.filter(function (w) { return w.level === lvl; });
    words = seededShuffle(words, 20260710 + lvlIdx);
    for (var i = 0; i < words.length; i += STAGE_SIZE) {
      stages.push({ level: lvl, words: words.slice(i, i + STAGE_SIZE) });
    }
  });
  stages.forEach(function (s, i) { s.index = i + 1; });
  return stages;
}
var STAGES = buildStages();

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var cachedVoices = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  cachedVoices = window.speechSynthesis.getVoices();
}
if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("這個瀏覽器不支援語音朗讀");
    return;
  }
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.9;
    if (!cachedVoices.length) cachedVoices = window.speechSynthesis.getVoices();
    var enVoice = cachedVoices.find(function (v) { return v.lang && v.lang.indexOf("en") === 0; });
    if (enVoice) u.voice = enVoice;
    u.onerror = function (e) {
      alert("發音失敗，原因：" + (e && e.error ? e.error : "未知") + "\n手機可能沒有安裝英文語音包，請到「設定 > 一般管理 > 語言與輸入法 > 文字轉語音輸出」檢查。");
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {
    alert("發音發生錯誤：" + e.message);
  }
}

// State

var state = {
  mode: "flash",
  difficulty: "all",
  score: 0,
  streak: 0,
  wrong: 0,
  cardOrder: [],
  cardPos: 0,
  flipped: false,
  qIndex: 0,
  question: null,
  selected: null,
  gIndex: 0,
  gSelected: null,
  sIndex: 0,
  scramble: null,
  sResult: null,
  built: [],
  stageIndex: null,
  stageHearts: 0,
  stageQuestions: [],
  stageQPos: 0,
  stageSelected: null,
  stageResult: null,
  stageTimer: 0,
  stageTimerId: null,
  stageStars: 0
};

// 隨機抽一個索引，且盡量不要跟上一次相同（題目數 > 1 時）
function randomIndex(poolLength, excludeIndex) {
  if (poolLength <= 1) return 0;
  var idx;
  do { idx = Math.floor(Math.random() * poolLength); } while (idx === excludeIndex);
  return idx;
}

// ------------------------------------------------------------------
// 本機持久化：最佳紀錄 + 答錯加權（存在裝置本機，離線也留得住）
// ------------------------------------------------------------------
function loadJSON(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

var BEST = loadJSON("eq_best", { score: 0, streak: 0 });
var MISTAKES = loadJSON("eq_mistakes", {});
var STAGE_PROGRESS = loadJSON("eq_stage_progress", { unlocked: 1, stars: {} });
function saveStageProgress() { saveJSON("eq_stage_progress", STAGE_PROGRESS); }

function mistakeKey(kind, item) {
  var id = item.en || item.sentence || item.zh || "";
  return kind + ":" + id;
}
function recordMistake(kind, item) {
  var k = mistakeKey(kind, item);
  MISTAKES[k] = (MISTAKES[k] || 0) + 1;
  saveJSON("eq_mistakes", MISTAKES);
}
// 答錯過的題目權重變高，會比較常出現，直到答對次數蓋過去為止
function weightedRandomIndex(pool, kind, excludeIndex) {
  if (pool.length <= 1) return 0;
  var weights = pool.map(function (item) { return 1 + (MISTAKES[mistakeKey(kind, item)] || 0) * 2; });
  var total = weights.reduce(function (a, b) { return a + b; }, 0);
  var idx, attempts = 0;
  do {
    var r = Math.random() * total;
    var cum = 0;
    idx = weights.length - 1;
    for (var i = 0; i < weights.length; i++) {
      cum += weights[i];
      if (r <= cum) { idx = i; break; }
    }
    attempts++;
  } while (idx === excludeIndex && attempts < 8);
  return idx;
}
function updateBest() {
  var changed = false;
  if (state.score > BEST.score) { BEST.score = state.score; changed = true; }
  if (state.streak > BEST.streak) { BEST.streak = state.streak; changed = true; }
  if (changed) saveJSON("eq_best", BEST);
}

function currentBank() {
  return WORD_BANK;
}
function wordPool() {
  return state.difficulty === "all" ? WORD_BANK : WORD_BANK.filter(function (w) { return w.level === state.difficulty; });
}
function grammarPool() {
  return state.difficulty === "all" ? GRAMMAR_BANK : GRAMMAR_BANK.filter(function (g) { return g.level === state.difficulty; });
}
function scramblePool() {
  return state.difficulty === "all" ? SCRAMBLE_BANK : SCRAMBLE_BANK.filter(function (s) { return s.level === state.difficulty; });
}

function buildWordQuestion(pool, index) {
  var correct = pool[index];
  var distractors = shuffle(pool.filter(function (w) { return w.en !== correct.en; })).slice(0, 3);
  var options = shuffle([correct].concat(distractors));
  return { correct: correct, options: options };
}
function buildScramble(pool, index) {
  var item = pool[index];
  var tokens = item.words.map(function (w, i) { return { id: index + "-" + i + "-" + w, text: w }; });
  return { zh: item.zh, words: item.words, shuffled: shuffle(tokens) };
}

function resetWordProgress() {
  var pool = wordPool();
  state.cardOrder = shuffle(pool.map(function (_, i) { return i; }));
  state.cardPos = 0;
  state.flipped = false;
  state.qIndex = weightedRandomIndex(pool, "word", -1);
  state.question = pool.length ? buildWordQuestion(pool, state.qIndex) : null;
  state.selected = null;
}
function resetGrammarScramble() {
  var gp = grammarPool();
  var sp = scramblePool();
  state.gIndex = weightedRandomIndex(gp, "grammar", -1);
  state.gSelected = null;
  state.sIndex = weightedRandomIndex(sp, "scramble", -1);
  state.scramble = sp.length ? buildScramble(sp, state.sIndex) : null;
  state.built = [];
  state.sResult = null;
}

// ------------------------------------------------------------------
// Actions
// ------------------------------------------------------------------
function setMode(m) {
  if (state.mode === "adventure" && m !== "adventure") clearStageTimer();
  state.mode = m;
  render();
}
function setDifficulty(d) { state.difficulty = d; resetWordProgress(); resetGrammarScramble(); render(); }

function flipCard() { state.flipped = !state.flipped; render(); }
function speakCard(e) {
  e.stopPropagation();
  var pool = wordPool();
  var card = pool[state.cardOrder[state.cardPos]];
  if (card) speak(card.en);
}
function nextCard(dir) {
  var pool = wordPool();
  if (!pool.length) return;
  state.flipped = false;
  if (dir === 1) {
    state.cardPos++;
    if (state.cardPos >= state.cardOrder.length) {
      state.cardOrder = shuffle(pool.map(function (_, i) { return i; }));
      state.cardPos = 0;
    }
  } else {
    state.cardPos--;
    if (state.cardPos < 0) {
      state.cardPos = state.cardOrder.length - 1;
    }
  }
  render();
}

function answerQuiz(optIndex) {
  if (state.selected !== null) return;
  var opt = state.question.options[optIndex];
  state.selected = opt.en;
  if (opt.en === state.question.correct.en) {
    state.score++; state.streak++;
    updateBest();
    speak(state.question.correct.en);
  } else {
    state.streak = 0; state.wrong++;
    recordMistake("word", state.question.correct);
  }
  render();
}
function nextQuestion() {
  var pool = wordPool();
  state.qIndex = weightedRandomIndex(pool, "word", state.qIndex);
  state.question = buildWordQuestion(pool, state.qIndex);
  state.selected = null;
  render();
}

function answerGrammar(optIndex) {
  if (state.gSelected !== null) return;
  var pool = grammarPool();
  var item = pool[state.gIndex];
  var opt = item.options[optIndex];
  state.gSelected = opt;
  if (opt === item.correct) {
    state.score++; state.streak++;
    updateBest();
  } else {
    state.streak = 0; state.wrong++;
    recordMistake("grammar", item);
  }
  render();
}
function nextGrammar() {
  var pool = grammarPool();
  state.gIndex = weightedRandomIndex(pool, "grammar", state.gIndex);
  state.gSelected = null;
  render();
}

function pickToken(id) {
  if (state.sResult) return;
  var token = state.scramble.shuffled.find(function (t) { return t.id === id; });
  if (!token) return;
  state.built.push(token);
  render();
}
function removeToken(idx) {
  if (state.sResult) return;
  state.built.splice(idx, 1);
  render();
}
function checkScramble() {
  var answer = state.built.map(function (t) { return t.text; }).join(" ");
  var correct = state.scramble.words.join(" ");
  if (answer === correct) {
    state.sResult = "correct"; state.score++; state.streak++;
    updateBest();
  } else {
    state.sResult = "wrong"; state.streak = 0; state.wrong++;
    recordMistake("scramble", state.scramble);
  }
  render();
}
function nextScramble() {
  var pool = scramblePool();
  state.sIndex = weightedRandomIndex(pool, "scramble", state.sIndex);
  state.scramble = buildScramble(pool, state.sIndex);
  state.built = [];
  state.sResult = null;
  render();
}

// ------------------------------------------------------------------
// 闖關地圖：關卡切割、計時器、生命值
// ------------------------------------------------------------------
function buildStageQuestion(stage, wordItem) {
  var samelevel = WORD_BANK.filter(function (w) { return w.level === stage.level && w.en !== wordItem.en; });
  var distractors = shuffle(samelevel).slice(0, 3);
  var options = shuffle([wordItem].concat(distractors));
  return { correct: wordItem, options: options };
}

function clearStageTimer() {
  if (state.stageTimerId !== null) {
    clearInterval(state.stageTimerId);
    state.stageTimerId = null;
  }
}

function startQuestionTimer() {
  clearStageTimer();
  state.stageTimer = TIME_PER_Q;
  state.stageTimerId = setInterval(function () {
    state.stageTimer--;
    if (state.stageTimer <= 0) {
      clearStageTimer();
      handleStageTimeout();
    } else {
      render();
    }
  }, 1000);
}

function startStage(stageIndex) {
  var stage = STAGES[stageIndex - 1];
  if (!stage) return;
  state.mode = "adventure";
  state.stageIndex = stageIndex;
  var shuffledWords = shuffle(stage.words);
  state.stageQuestions = shuffledWords.map(function (w) { return buildStageQuestion(stage, w); });
  state.stageQPos = 0;
  state.stageHearts = HEARTS_START;
  state.stageSelected = null;
  state.stageResult = null;
  startQuestionTimer();
  render();
}

function handleStageTimeout() {
  state.stageSelected = "__timeout__";
  state.stageHearts--;
  if (state.stageHearts <= 0) {
    state.stageResult = "failed";
  }
  render();
}

function answerStageQuestion(optIndex) {
  if (state.stageSelected !== null || state.stageResult) return;
  clearStageTimer();
  var q = state.stageQuestions[state.stageQPos];
  var opt = q.options[optIndex];
  state.stageSelected = opt.en;
  if (opt.en !== q.correct.en) {
    state.stageHearts--;
    if (state.stageHearts <= 0) {
      state.stageResult = "failed";
    }
  }
  render();
}

function nextStageQuestion() {
  if (state.stageResult) return;
  state.stageQPos++;
  if (state.stageQPos >= state.stageQuestions.length) {
    state.stageResult = "cleared";
    state.stageStars = state.stageHearts >= 3 ? 3 : (state.stageHearts === 2 ? 2 : 1);
    if (STAGE_PROGRESS.unlocked <= state.stageIndex) {
      STAGE_PROGRESS.unlocked = state.stageIndex + 1;
    }
    var prevStars = STAGE_PROGRESS.stars[state.stageIndex] || 0;
    if (state.stageStars > prevStars) {
      STAGE_PROGRESS.stars[state.stageIndex] = state.stageStars;
    }
    saveStageProgress();
    render();
    return;
  }
  state.stageSelected = null;
  startQuestionTimer();
  render();
}

function retryStage() {
  startStage(state.stageIndex);
}

function exitStage() {
  clearStageTimer();
  state.stageIndex = null;
  state.stageResult = null;
  render();
}

var LEVEL_LABELS = { basic: "基礎", advanced: "進階", hell: "\uD83D\uDC51 地獄" };
function levelLabel(item) {
  return LEVEL_LABELS[item.level] || "";
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ------------------------------------------------------------------
// Render
// ------------------------------------------------------------------
function render() {
  var level = Math.floor(state.score / LEVEL_SIZE) + 1;
  var progressPct = (state.score % LEVEL_SIZE) / LEVEL_SIZE * 100;

  var html = "";
  html += '<div class="hud">';
  html += '<div>\u2694\uFE0F LV.' + level + '</div>';
  html += '<div class="hud-bar"><div class="hud-bar-fill" style="width:' + progressPct + '%"></div></div>';
  html += '<div class="hud-trophy">\uD83C\uDFC6 ' + state.score + '</div>';
  html += '</div>';
  html += '<div class="best-row">\uD83E\uDD47 最佳分數 ' + BEST.score + '　\u26A1 最長連勝 ' + BEST.streak + '</div>';

  html += '<h1 class="title">英文任務系統</h1>';
  if (state.mode === "adventure") {
    var clearedCount = Object.keys(STAGE_PROGRESS.stars).length;
    html += '<p class="subtitle">已過 ' + clearedCount + ' / ' + STAGES.length + ' 關</p>';
  } else {
    var totalCount = wordPool().length;
    html += '<p class="subtitle">共 ' + totalCount + ' 字</p>';
  }

  if (state.mode !== "adventure") {
    html += '<div class="chip-row">';
    DIFFICULTIES.forEach(function (d) {
      var active = state.difficulty === d.key ? " active" : "";
      html += '<button class="chip' + active + '" onclick="setDifficulty(\'' + d.key + '\')">' + d.label + '</button>';
    });
    html += '</div>';
  }

  html += '<div class="mode-tabs">';
  MODES.forEach(function (m) {
    var active = state.mode === m.key ? " active" : "";
    html += '<button class="mode-tab' + active + '" onclick="setMode(\'' + m.key + '\')">' + m.label + '</button>';
  });
  html += '</div>';

  html += '<div class="panel">';

  if (state.mode === "flash") {
    var pool = wordPool();
    if (!pool.length) {
      html += '<p class="hint">這個難度沒有單字</p>';
    } else {
      var card = pool[state.cardOrder[state.cardPos]];
      html += '<div class="card-outer" onclick="flipCard()">';
      html += '  <div class="card-inner' + (state.flipped ? " flipped" : "") + '">';
      html += '    <div class="card-face card-front">';
      html += '      <div class="word-en">' + esc(card.en) + '</div>';
      var metaLabel = levelLabel(card) ? (esc(card.pos) + ' \u00B7 ' + levelLabel(card)) : esc(card.pos);
      html += '      <div class="word-meta">' + metaLabel + '</div>';
      html += '      <button class="speak-btn" onclick="speakCard(event)">\uD83D\uDD0A 播放發音</button>';
      html += '      <div class="hint">點卡片翻面看中文</div>';
      html += '    </div>';
      html += '    <div class="card-face card-back">';
      html += '      <div class="word-en">' + esc(card.zh) + '</div>';
      html += '      <div class="word-meta">' + metaLabel + '</div>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
      html += '<div class="nav-row">';
      html += '  <button class="nav-btn" onclick="nextCard(-1)">\u2190 上一個</button>';
      html += '  <span class="nav-count">' + (state.cardPos + 1) + ' / ' + pool.length + '</span>';
      html += '  <button class="nav-btn" onclick="nextCard(1)">下一個 \u2192</button>';
      html += '</div>';
    }
  }

  if (state.mode === "quiz") {
    var qp = wordPool();
    if (!qp.length || !state.question) {
      html += '<p class="hint">這個難度沒有單字</p>';
    } else {
      var q = state.question;
      html += '<div class="quiz-box">';
      var qLabel = levelLabel(q.correct) ? (' (' + levelLabel(q.correct) + ')') : '';
      html += '  <div class="word-meta">這個字是什麼意思？' + qLabel + '</div>';
      html += '  <div class="word-en" style="margin-top:6px;">' + esc(q.correct.en) + '</div>';
      html += '  <button class="speak-btn" onclick="speak(\'' + esc(q.correct.en).replace(/'/g, "\\'") + '\')">\uD83D\uDD0A 播放發音</button>';
      html += '</div>';
      html += '<div class="option-list">';
      q.options.forEach(function (opt, i) {
        var cls = "option-btn";
        var mark = "";
        if (state.selected) {
          if (opt.en === q.correct.en) { cls += " correct"; mark = " \u2705"; }
          else if (state.selected === opt.en) { cls += " wrong"; mark = " \u274C"; }
          else { cls += " dim"; }
        }
        html += '<button class="' + cls + '" ' + (state.selected ? "disabled" : "") + ' onclick="answerQuiz(' + i + ')"><span>' + esc(opt.zh) + '</span><span>' + mark + '</span></button>';
      });
      html += '</div>';
      if (state.selected) {
        html += '<button class="next-btn" onclick="nextQuestion()">\uD83D\uDD04 下一題</button>';
      }
    }
  }

  if (state.mode === "grammar") {
    var gp = grammarPool();
    if (!gp.length) {
      html += '<p class="hint">這個難度沒有文法題</p>';
    } else {
      var gItem = gp[state.gIndex];
      html += '<div class="grammar-box">';
      html += '  <div class="word-meta">選出正確的空格答案</div>';
      html += '  <div class="word-en" style="font-size:20px; margin-top:8px; line-height:1.5;">' + esc(gItem.sentence) + '</div>';
      html += '</div>';
      html += '<div class="option-grid">';
      gItem.options.forEach(function (opt, i) {
        var cls = "option-btn mono";
        if (state.gSelected) {
          if (opt === gItem.correct) cls += " correct";
          else if (state.gSelected === opt) cls += " wrong";
          else cls += " dim";
        }
        html += '<button class="' + cls + '" ' + (state.gSelected ? "disabled" : "") + ' onclick="answerGrammar(' + i + ')">' + esc(opt) + '</button>';
      });
      html += '</div>';
      if (state.gSelected) {
        html += '<div class="tip-box">\uD83D\uDCA1 ' + esc(gItem.tip) + '</div>';
        if (gItem.zh) {
          html += '<div class="tip-box">\uD83D\uDCD6 ' + esc(gItem.zh) + '</div>';
        }
        var fullSentence = gItem.sentence.replace("___", gItem.correct);
        html += '<button class="speak-btn" onclick="speak(\'' + esc(fullSentence).replace(/'/g, "\\'") + '\')">\uD83D\uDD0A 播放完整句子</button>';
        html += '<button class="next-btn" onclick="nextGrammar()">\uD83D\uDD04 下一題</button>';
      }
    }
  }

  if (state.mode === "scramble") {
    var sp = scramblePool();
    if (!sp.length || !state.scramble) {
      html += '<p class="hint">這個難度沒有句子</p>';
    } else {
      var scr = state.scramble;
      html += '<div class="scramble-box">';
      html += '  <div class="word-meta">把單字排成正確的句子</div>';
      html += '  <div class="scramble-zh">' + esc(scr.zh) + '</div>';
      html += '</div>';

      html += '<div class="token-area">';
      if (state.built.length === 0) {
        html += '<span class="token-placeholder">點下面的單字依順序排列 \u2192</span>';
      }
      state.built.forEach(function (t, i) {
        html += '<button class="token-chip" onclick="removeToken(' + i + ')">' + esc(t.text) + '</button>';
      });
      html += '</div>';

      var remaining = scr.shuffled.filter(function (t) {
        return !state.built.find(function (b) { return b.id === t.id; });
      });
      html += '<div class="token-pool">';
      remaining.forEach(function (t) {
        var safeId = t.id.replace(/'/g, "\\'");
        html += '<button class="token-chip pool" onclick="pickToken(\'' + safeId + '\')">' + esc(t.text) + '</button>';
      });
      html += '</div>';

      if (!state.sResult) {
        var disabled = state.built.length !== scr.words.length ? "disabled" : "";
        html += '<button class="check-btn" ' + disabled + ' onclick="checkScramble()">\uD83D\uDD00 檢查答案</button>';
      }
      if (state.sResult === "correct") {
        html += '<div class="result-correct">\u2705 正確！</div>';
      }
      if (state.sResult === "wrong") {
        html += '<div class="result-wrong"><div class="label">\u274C 再想想</div><div class="answer">正確答案：' + esc(scr.words.join(" ")) + '</div></div>';
      }
      if (state.sResult) {
        var fullAnswer = scr.words.join(" ").replace(/ ([?.!])/g, "$1");
        html += '<button class="speak-btn" onclick="speak(\'' + esc(fullAnswer).replace(/'/g, "\\'") + '\')">\uD83D\uDD0A 播放完整句子</button>';
        html += '<button class="next-btn" onclick="nextScramble()">\uD83D\uDD04 下一句</button>';
      }
    }
  }

  if (state.mode === "adventure") {
    if (state.stageIndex === null) {
      html += '<div class="stage-map">';
      var sectionLabels = { basic: "\u2600\uFE0F 基礎關卡", advanced: "\u2694\uFE0F 進階關卡", hell: "\uD83D\uDC51 地獄關卡" };
      ["basic", "advanced", "hell"].forEach(function (lvl) {
        var stagesOfLevel = STAGES.filter(function (s) { return s.level === lvl; });
        html += '<div>';
        html += '<div class="stage-section-title">' + sectionLabels[lvl] + '</div>';
        html += '<div class="stage-grid">';
        stagesOfLevel.forEach(function (s) {
          var locked = s.index > STAGE_PROGRESS.unlocked;
          var cleared = !!STAGE_PROGRESS.stars[s.index];
          var current = !locked && !cleared;
          var cls = "stage-node" + (locked ? " locked" : "") + (cleared ? " cleared" : "") + (current ? " current" : "");
          var onclick = locked ? "" : ' onclick="startStage(' + s.index + ')"';
          html += '<button class="' + cls + '"' + onclick + '>';
          html += locked ? "\uD83D\uDD12" : s.index;
          if (cleared) {
            var stars = STAGE_PROGRESS.stars[s.index];
            html += '<div class="stage-stars">' + "\u2B50".repeat(stars) + '</div>';
          }
          html += '</button>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    } else {
      var stage = STAGES[state.stageIndex - 1];
      if (state.stageResult === "cleared") {
        html += '<div class="stage-result-overlay">';
        html += '<div class="word-en">\uD83C\uDF89 過關！</div>';
        html += '<div style="font-size:28px; margin:12px 0;">' + "\u2B50".repeat(state.stageStars) + "\u2B50".repeat(3 - state.stageStars).replace(/\u2B50/g, "\u2606") + '</div>';
        html += '<button class="next-btn" onclick="exitStage()">\uD83D\uDDFA\uFE0F 返回地圖</button>';
        if (state.stageIndex < STAGES.length && state.stageIndex < STAGE_PROGRESS.unlocked) {
          html += ' <button class="next-btn" onclick="startStage(' + (state.stageIndex + 1) + ')">\u25B6\uFE0F 下一關</button>';
        }
        html += '</div>';
      } else if (state.stageResult === "failed") {
        html += '<div class="stage-result-overlay">';
        html += '<div class="word-en">\uD83D\uDC80 關卡失敗</div>';
        html += '<div class="hint">生命值歸零了，再試一次！</div>';
        html += '<button class="next-btn" onclick="retryStage()">\uD83D\uDD01 重新挑戰</button> ';
        html += '<button class="next-btn" onclick="exitStage()">\uD83D\uDDFA\uFE0F 返回地圖</button>';
        html += '</div>';
      } else {
        var sq = state.stageQuestions[state.stageQPos];
        html += '<div class="hearts-row">';
        for (var h = 0; h < HEARTS_START; h++) {
          html += h < state.stageHearts ? "\u2764\uFE0F" : "\uD83D\uDDA4";
        }
        html += '<span class="nav-count" style="margin-left:auto;">' + (state.stageQPos + 1) + ' / ' + state.stageQuestions.length + '</span>';
        html += '</div>';
        html += '<div class="timer-bar-outer"><div class="timer-bar-fill" style="width:' + (state.stageTimer / TIME_PER_Q * 100) + '%"></div></div>';
        html += '<div class="quiz-box">';
        html += '  <div class="word-meta">這個字是什麼意思？</div>';
        html += '  <div class="word-en" style="margin-top:6px;">' + esc(sq.correct.en) + '</div>';
        html += '  <button class="speak-btn" onclick="speak(\'' + esc(sq.correct.en).replace(/'/g, "\\'") + '\')">\uD83D\uDD0A 播放發音</button>';
        html += '</div>';
        html += '<div class="option-list">';
        sq.options.forEach(function (opt, i) {
          var cls = "option-btn";
          var mark = "";
          if (state.stageSelected) {
            if (opt.en === sq.correct.en) { cls += " correct"; mark = " \u2705"; }
            else if (state.stageSelected === opt.en) { cls += " wrong"; mark = " \u274C"; }
            else { cls += " dim"; }
          }
          html += '<button class="' + cls + '" ' + (state.stageSelected ? "disabled" : "") + ' onclick="answerStageQuestion(' + i + ')"><span>' + esc(opt.zh) + '</span><span>' + mark + '</span></button>';
        });
        html += '</div>';
        if (state.stageSelected) {
          html += '<button class="next-btn" onclick="nextStageQuestion()">\uD83D\uDD04 下一題</button>';
        }
      }
    }
  }

  html += '</div>'; // panel

  html += '<div class="footer-stats"><span>連對 ' + state.streak + '</span><span>答錯 ' + state.wrong + '</span></div>';

  var badges = [];
  if (state.streak >= 3) badges.push("連對 3 題");
  if (state.streak >= 5) badges.push("連對 5 題 \uD83D\uDD25");
  if (badges.length) {
    html += '<div class="badges">';
    badges.forEach(function (b) {
      html += '<span class="badge">\u2B50 ' + b + '</span>';
    });
    html += '</div>';
  }

  document.getElementById("root").innerHTML = html;
}

// init
resetWordProgress();
resetGrammarScramble();
render();
</script>
</body>
</html>
